version: 1

# SETTINGS_URL is delivered as an encrypted Testing Farm secret below, so the
# location of the served configuration is not advertised in plain text. The
# decrypted value is the URL of a sanitized (secret-free) settings.toml;
# credential values never appear in that file — they are delivered separately
# as Testing Farm secrets (PYTEST_CLIENT_TOOLS_* environment variables
# override same-named keys from the downloaded file; those blobs are added to
# this same map by the sync job at cutover). Gating pipelines pass the same
# URL at request time.
#
# To regenerate this entry:
#   testing-farm encrypt <url> --git-url https://github.com/RedHatInsights/yggdrasil
# (authenticates with the team token; keep entries scalar — the sync job's
# layout validation requires it).
# See: https://docs.testing-farm.io/Testing%20Farm/0.1/test-request.html#secrets-in-repo-config
environments:
  default:
    secrets:
      SETTINGS_URL: "f59f9cfd-119c-40db-a0e5-c4e9ef277da5,"
