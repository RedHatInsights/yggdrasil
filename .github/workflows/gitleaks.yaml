name: Secret scanning

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Full clone: the pull request scan covers only the commits the
      # change adds on top of the branch it targets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          # gitleaks-action@v2 requires a (paid) license key for
          # organizations with more than four contributors; run the
          # MIT-licensed gitleaks binary directly instead. The release
          # archive is verified against a pinned checksum.
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # A pull request is scanned only for the commits it adds on top of
      # its target branch; a push to main is scanned from the commit it
      # replaced, so history is never re-scanned and pre-existing findings
      # cannot block a change.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            gitleaks detect --source . --redact --verbose \
              --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${EVENT_BEFORE}" ] && \
               git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null 2>&1; then
            gitleaks detect --source . --redact --verbose \
              --log-opts="--no-merges ${EVENT_BEFORE}..HEAD"
          else
            gitleaks detect --source . --redact --verbose
          fi
